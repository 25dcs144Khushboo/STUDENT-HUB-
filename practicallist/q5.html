<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <link rel="stylesheet" href="q5c.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Management</h1>

        <div class="form-box">
            <input type="text" id="name" placeholder="Enter student name">
            <input type="number" id="marks1" placeholder="Subject 1 Marks">
            <input type="number" id="marks2" placeholder="Subject 2 Marks">
            <input type="number" id="marks3" placeholder="Subject 3 Marks">

            <button onclick="addStudent()">Add Student</button>
            <button onclick="showResults()">Show Results</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="q5j.js"></script>
</body>
</html>
