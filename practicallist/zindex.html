<!DOCTYPE html>
<html>
<head>
    <title>Z-Index</title>

    <style>

        .box1 {
            width: 150px;
            height: 150px;

            background-color: red;

            position: absolute;
            top: 100px;
            left: 100px;

            z-index: 1;
        }

        .box2 {
            width: 150px;
            height: 150px;

            background-color: blue;

            position: absolute;
            top: 150px;
            left: 150px;

            z-index: 2;
        }

    </style>
</head>

<body>

    <div class="box1">Box 1</div>
    <div class="box2">Box 2</div>

</body>
</html>
