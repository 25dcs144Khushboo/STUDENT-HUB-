<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Feedback Form</title>
    <link rel="stylesheet" href="q2c.css">
</head>
<body>

    <div class="container">
        <h1>Product Feedback Form</h1>

        <form id="feedbackForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="product">Product Name</label>
            <input type="text" id="product" placeholder="Enter product name">

            <label for="rating">Rating</label>
            <select id="rating">
                <option value="">Select Rating</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Average</option>
                <option value="2">2 - Poor</option>
                <option value="1">1 - Very Poor</option>
            </select>

            <label for="message">Feedback</label>
            <textarea id="message" placeholder="Enter your feedback"></textarea>

            <button type="submit">Submit Feedback</button>

            <p id="result"></p>

        </form>
    </div>

    <script src="q2j.js"></script>
</body>
</html>
